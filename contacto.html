<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publicar Contrato | The Witcher Wiki</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen flex flex-col font-sans antialiased selection:bg-red-900 selection:text-white">

  <!-- Header Dinámico -->
  <div id="navbar-container"></div>

  <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
    
    <!-- Encabezado de la Sección -->
    <header class="mb-8 text-center sm:text-left">
      <div class="inline-block bg-red-900/20 text-red-500 border border-red-900/50 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-[0.3em] mb-4">
        Aviso Oficial
      </div>
      <h1 class="text-4xl sm:text-5xl font-serif text-white uppercase tracking-tighter">
        Publicar un <span class="text-red-700">Contrato</span>
      </h1>
      <p class="text-zinc-500 mt-4 italic text-sm sm:text-base">
        Deja tus datos si necesitas los servicios de un profesional de la Escuela del Lobo.
      </p>
    </header>

    <!-- Formulario de Contacto -->
    <section class="bg-zinc-900 border-2 border-zinc-800 p-6 sm:p-12 rounded-xl shadow-2xl relative overflow-hidden">
      <div class="absolute top-0 right-0 w-32 h-32 bg-red-700/5 blur-3xl rounded-full -mr-16 -mt-16 pointer-events-none"></div>

      <!-- Mensaje de estado (Éxito / Error) inyectado dinámicamente -->
      <div id="form-status" class="hidden mb-6 p-4 rounded text-xs uppercase tracking-wider font-bold border"></div>

      <form id="contacto-form" class="space-y-8 relative z-10" novalidate>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label for="nombre" class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Nombre</label>
            <input type="text" id="nombre" name="nombre" required 
              class="bg-zinc-950 border border-zinc-800 rounded px-4 py-3 text-white focus:outline-none focus:border-red-700 focus:ring-1 focus:ring-red-700 transition-all">
          </div>
          <div class="flex flex-col gap-2">
            <label for="apellidos" class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Apellidos</label>
            <input type="text" id="apellidos" name="apellidos" required
              class="bg-zinc-950 border border-zinc-800 rounded px-4 py-3 text-white focus:outline-none focus:border-red-700 focus:ring-1 focus:ring-red-700 transition-all">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label for="email" class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Correo Electrónico</label>
            <input type="email" id="email" name="email" required
              class="bg-zinc-950 border border-zinc-800 rounded px-4 py-3 text-white focus:outline-none focus:border-red-700 focus:ring-1 focus:ring-red-700 transition-all">
          </div>
          <div class="flex flex-col gap-2">
            <label for="telefono" class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Teléfono de contacto</label>
            <input type="tel" id="telefono" name="telefono" required
              class="bg-zinc-950 border border-zinc-800 rounded px-4 py-3 text-white focus:outline-none focus:border-red-700 focus:ring-1 focus:ring-red-700 transition-all">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="flex flex-col gap-2">
            <label for="temas" class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Asunto del Contrato</label>
            <select id="temas" name="temas" class="bg-zinc-950 border border-zinc-800 rounded px-4 py-3 text-white focus:outline-none focus:border-red-700">
              <option value="Videojuegos">Caza de Monstruos (Videojuegos)</option>
              <option value="Películas">Relatos de Bardos (Películas)</option>
              <option value="Noticias">Novedades del Continente</option>
              <option value="Curiosidades">Secretos de Alquimia</option>
            </select>
          </div>
          <div class="flex flex-col gap-2">
            <label for="calificacion" class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Nivel de Peligro (Calificación)</label>
            <select id="calificacion" name="calificacion" class="bg-zinc-950 border border-zinc-800 rounded px-4 py-3 text-white focus:outline-none focus:border-red-700">
              <option value="1">1 - Humilde campesino</option>
              <option value="5">5 - Soldado de Nilfgaard</option>
              <option value="10">10 - Rey de la Cacería Salvaje</option>
            </select>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          <label for="sugerencias" class="text-xs uppercase tracking-widest text-zinc-500 font-bold">Descripción del Encargo</label>
          <textarea id="sugerencias" name="sugerencias" rows="4" required 
            class="bg-zinc-950 border border-zinc-800 rounded px-4 py-3 text-white focus:outline-none focus:border-red-700 resize-none"></textarea>
        </div>

        <div class="space-y-4 pt-4 border-t border-zinc-800">
          <label class="flex items-center gap-3 cursor-pointer group">
            <input type="checkbox" id="novedades" class="w-5 h-5 rounded border-zinc-800 bg-zinc-950 text-red-700 focus:ring-red-700 accent-red-700">
            <span class="text-sm text-zinc-400 group-hover:text-zinc-200 transition-colors">Deseo recibir misivas con las novedades de la web</span>
          </label>

          <div class="py-2">
            <p class="text-xs uppercase tracking-widest text-zinc-500 font-bold mb-3">¿Aceptas el Código de los Brujos?</p>
            <div class="flex gap-6">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="terminos" value="si" class="accent-red-700 w-4 h-4">
                <span class="text-sm text-zinc-400">Acepto</span>
              </label>
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="radio" name="terminos" value="no" checked class="accent-red-700 w-4 h-4">
                <span class="text-sm text-zinc-400">Rechazo</span>
              </label>
            </div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 pt-6">
          <button type="submit" class="flex-1 bg-red-700 hover:bg-red-800 text-white font-bold py-4 rounded uppercase tracking-[0.2em] transition-all shadow-lg hover:shadow-red-900/20 active:scale-95">
            Publicar Contrato
          </button>
          <button type="reset" class="px-8 py-4 border border-zinc-800 text-zinc-500 hover:bg-zinc-800 hover:text-white rounded uppercase tracking-widest text-xs transition-all">
            Limpiar Pergamino
          </button>
        </div>
      </form>
    </section>

  </main>

  <!-- Footer Dinámico -->
  <footer id="footer-container"></footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
