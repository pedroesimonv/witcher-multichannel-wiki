<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- SEO Básico -->
  <title>The Witcher Saga | Crónicas del Continente</title>
  <meta name="description" content="Sumérgete en el universo de Geralt de Rivia. Explora la historia, personajes y adaptaciones de la obra maestra de fantasía oscura creada por Andrzej Sapkowski." />
  <meta name="author" content="Pedro" />
  
  <!-- Open Graph (LinkedIn, Discord, Facebook) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vercel.com/pesv2526s-projects/witcher-multichannel-wiki" />
  <meta property="og:title" content="The Witcher Saga | Crónicas del Continente" />
  <meta property="og:description" content="Sumérgete en el universo de Geralt de Rivia. Explora la historia, personajes y adaptaciones de la obra maestra de fantasía oscura." />
  <meta property="og:image" content="https://vercel.com/pesv2526s-projects/witcher-multichannel-wikimedia/og-image.webp" />
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Witcher Saga | Crónicas del Continente" />
  <meta name="twitter:description" content="Sumérgete en el universo de Geralt de Rivia. Explora la historia, personajes y adaptaciones." />
  <meta name="twitter:image" content="https://vercel.com/pesv2526s-projects/witcher-multichannel-wikimedia/og-image.webp" />

  <!-- Favicon y Fuentes -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen flex flex-col font-sans antialiased selection:bg-red-900 selection:text-white">

  <!-- Header Dinámico -->
  <header id="navbar-container"></header>

  <!-- Contenido Principal -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
    
    <!-- Hero / Bienvenida -->
    <section class="text-center mb-16 relative">
      <div class="inline-block bg-red-900/20 text-red-500 border border-red-900/50 px-4 py-1 rounded-full text-xs font-bold uppercase tracking-[0.3em] mb-4">
        Crónicas del Lobo Blanco
      </div>
      <h1 class="text-4xl sm:text-6xl font-serif font-bold text-white mb-6 uppercase tracking-tighter">
        Bienvenido al mundo de <span class="text-red-600">Geralt de Rivia</span>
      </h1>
      <div class="space-y-4 max-w-3xl mx-auto text-base sm:text-lg text-zinc-400">
        <p>
          Sumérgete en el fascinante universo creado por Andrzej Sapkowski. Explora las sendas del Continente, sus criaturas legendarias y los secretos de la alquimia de los brujos.
        </p>
      </div>
    </section>

    <!-- Galería / Cartas de Personajes (Gwent) -->
    <section class="mb-20">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-4 mb-8">
        <div>
          <span class="text-xs text-red-500 font-bold uppercase tracking-widest block">Baraja Legendaria</span>
          <h2 class="text-2xl sm:text-3xl font-serif text-white uppercase">Personajes Principales</h2>
        </div>
      </div>

      <!-- Contenedor inyectado dinámicamente desde renderers.js -->
      <div id="personajes-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        <!-- Renderizado dinámico de cartas -->
      </div>
    </section>

  </main>

  <!-- Footer Dinámico -->
  <footer id="footer-container"></footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
